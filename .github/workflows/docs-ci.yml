name: Docs CI

# Builds the docs site on PRs (and merge-queue commits) that touch docs/ or the runtime palette it themes
# from. The Astro build runs starlight-links-validator, so broken internal links
# fail the check. The job always runs (so it can be a required status check) but
# only does work when one of those changed.

on:
  pull_request:
  # A required check, so it must also report on merge-queue commits.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    name: Build docs (link-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: changes
        env:
          BASE: ${{ github.base_ref }}
          # A merge_group has no base_ref; it carries the main commit it builds on.
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$QUEUE_BASE" ]; then
            range="$QUEUE_BASE...HEAD"
          else
            git fetch origin "$BASE" --depth=1 --quiet
            range="origin/$BASE...HEAD"
          fi
          # The docs theme is projected from the runtime palette, so a palette change rebuilds them.
          if git diff --name-only "$range" | grep -qE '^(docs/|web/src/theme/palette\.ts$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs/ changes — nothing to build."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.docs == 'true'
        with:
          # Same bun as ci.yml (test/unit/build-pins.test.ts checks it).
          # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
          bun-version: "1.3.14"

      - name: Install and build (fails on broken internal links)
        if: steps.changes.outputs.docs == 'true'
        run: cd docs && bun install --frozen-lockfile && bun run build
