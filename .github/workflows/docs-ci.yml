name: Docs CI

# Builds the docs site on ready PRs and merge-queue commits that touch docs/, the
# runtime palette it themes from, or the Server SDK source and examples its SDK pages are built from. The Astro build runs starlight-links-validator, so
# broken internal links fail the check. A draft PR skips it, as ci.yml skips every
# check on a draft.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A required check, so it must also report on merge-queue commits.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  build:
    name: Build docs (link-checked)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: changes
        env:
          BASE: ${{ github.base_ref }}
          # A merge_group has no base_ref; it carries the main commit it builds on.
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$QUEUE_BASE" ]; then
            range="$QUEUE_BASE...HEAD"
          else
            git fetch origin "$BASE" --depth=1 --quiet
            range="origin/$BASE...HEAD"
          fi
          # The docs theme is projected from the runtime palette, and the Server SDK pages are
          # built from the SDK's docstrings and examples, so a change to either rebuilds them.
          if git diff --name-only "$range" | grep -qE '^(docs/|web/src/theme/palette\.ts$|packages/server-sdk-py/(src/|examples/|pyproject\.toml$|uv\.lock$)|\.github/workflows/docs-(ci|pages)\.yml$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No docs/ changes — nothing to build."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.docs == 'true'
        with:
          # Same bun as ci.yml (test/unit/build-pins.test.ts checks it).
          # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
          bun-version: "1.4.4"

      # The build writes the Server SDK API reference from the package's docstrings.
      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv dropped floating major tags (v8+); pin exact
        if: steps.changes.outputs.docs == 'true'

      # A public name with no docstring, or one that cannot be resolved, must fail the build.
      - name: Test the reference generator
        if: steps.changes.outputs.docs == 'true'
        run: cd docs && bun run test:reference

      - name: Install and build (fails on broken internal links)
        if: steps.changes.outputs.docs == 'true'
        run: cd docs && bun install --frozen-lockfile && bun run build
