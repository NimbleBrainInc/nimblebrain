name: No AI attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  no-ai-attribution:
    uses: NimbleBrainInc/.github/.github/workflows/no-ai-attribution.yml@main
