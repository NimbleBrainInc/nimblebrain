name: Caddyfile CI

on:
  pull_request:
    branches: [main, 'next/**']
    paths:
      - "web/Caddyfile"
      - "web/Dockerfile"
      - "web/public/app-frame.html"
      - ".github/workflows/caddyfile-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/Caddyfile"
      - "web/Dockerfile"
      - "web/public/app-frame.html"
      - ".github/workflows/caddyfile-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Validate with the Caddy the web image ships, read from its pinned FROM, so
      # CI and the image cannot run different Caddy builds.
      - name: Resolve the shipped Caddy image
        run: |
          image=$(sed -n 's/^FROM \(caddy:[^ ]*\).*/\1/p' web/Dockerfile)
          [ -n "$image" ] || { echo "FAIL: no caddy FROM in web/Dockerfile"; exit 1; }
          echo "CADDY_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Validate web/Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Embedded apps run in an OPAQUE origin (srcdoc iframe without
      # allow-same-origin), and fonts are always fetched in CORS mode — so their
      # font requests arrive with `Origin: null` and are blocked unless the file
      # carries ACAO. Validation can't see that; only a running server can, and
      # the failure mode is silent (the app falls back to system-ui), so it is
      # exactly the kind of regression a config lint would miss forever.
      - name: "Fonts are served with CORS (Origin: null)"
        run: |
          set -euo pipefail
          mkdir -p srv/assets
          head -c 64 /dev/urandom > srv/assets/probe.woff2
          echo '<html></html>' > srv/index.html
          docker run -d --name caddy-cors \
            -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/srv:/srv:ro" \
            -p 8080:8080 "$CADDY_IMAGE"
          # `|| sleep 1` makes each iteration succeed, so `set -e` cannot see a
          # loop that never came up — it would fall through and fail below as
          # "fonts lack ACAO", blaming the Caddyfile for a container that never
          # started. Fail here, with the logs that explain it.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://localhost:8080/" && break || sleep 1
          done
          curl -fsS -o /dev/null "http://localhost:8080/" || {
            echo "FAIL: caddy never became ready"; docker logs caddy-cors; exit 1; }

          echo "--- font asset ---"
          hdrs=$(curl -sI -H 'Origin: null' http://localhost:8080/assets/probe.woff2)
          echo "$hdrs"
          echo "$hdrs" | grep -iq '^access-control-allow-origin: \*' || {
            echo "FAIL: fonts lack Access-Control-Allow-Origin — iframe apps will
            silently render in system-ui"; docker logs caddy-cors; exit 1; }

          echo "--- non-font asset must NOT be opened up ---"
          if curl -sI -H 'Origin: null' http://localhost:8080/index.html \
               | grep -iq '^access-control-allow-origin'; then
            echo "FAIL: ACAO leaked beyond fonts"; exit 1
          fi

          # A hashed asset either exists or it does not — its name embeds its
          # content, so no other file is a valid answer. Under a shared SPA
          # `try_files` a missing one returns `200 text/html`: a stale font URL
          # then reads as healthy in devtools and in logs while the browser
          # quietly fails to parse it, which is the same silent failure the ACAO
          # check above exists to catch. /assets/* must have no SPA fallback.
          echo "--- a missing hashed asset must 404, not fall back to index.html ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H 'Origin: null' http://localhost:8080/assets/nonexistent.woff2)
          if [ "$code" != "404" ]; then
            echo "FAIL: missing font returned $code, not 404 — the SPA fallback is"
            echo "      serving index.html as a font. A stale asset URL will look healthy."
            docker logs caddy-cors; exit 1
          fi

          echo "--- the shell document must not leak its URL or be framed ---"
          shell=$(curl -sI http://localhost:8080/w/acme/app/crm)
          echo "$shell"
          echo "$shell" | grep -iq '^referrer-policy: strict-origin-when-cross-origin' || {
            echo "FAIL: shell document lacks Referrer-Policy"; exit 1; }
          echo "$shell" | grep -iq '^x-frame-options: DENY' || {
            echo "FAIL: shell document lacks X-Frame-Options"; exit 1; }
          echo "$shell" | grep -iq "^content-security-policy: frame-ancestors 'none'" || {
            echo "FAIL: shell document lacks frame-ancestors"; exit 1; }
          # Images load from this origin and the listed hosts only; a bare
          # `https:` source would admit every host.
          echo "$shell" | grep -iq "^content-security-policy: .*img-src 'self' data: blob: https://static\.nimblebrain\.ai" || {
            echo "FAIL: shell document lacks img-src"; exit 1; }
          if echo "$shell" | tr -d '\r' | grep -i '^content-security-policy:' | grep -Eq "img-src[^;]* https:( |;|$)"; then
            echo "FAIL: shell img-src admits every https host"; exit 1
          fi

          # App frames nest each app in this page so the app's base URL never
          # names the shell's URL. It must be the page itself (never the SPA
          # fallback, which would boot the shell inside a frame), and framable
          # by this origin only.
          echo "--- the app frame page ---"
          cp web/public/app-frame.html srv/app-frame.html
          frame=$(curl -sI http://localhost:8080/app-frame.html)
          echo "$frame"
          echo "$frame" | grep -iq "^content-security-policy: frame-ancestors 'self'" || {
            echo "FAIL: app frame page is not framable by this origin only"; exit 1; }
          echo "$frame" | grep -iq '^x-frame-options: SAMEORIGIN' || {
            echo "FAIL: app frame page lacks X-Frame-Options"; exit 1; }
          curl -fsS http://localhost:8080/app-frame.html | grep -q 'data-app-frame' || {
            echo "FAIL: app frame path does not serve the frame page"; exit 1; }
          rm srv/app-frame.html
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/app-frame.html)
          if [ "$code" != "404" ]; then
            echo "FAIL: a missing app frame page returned $code, not 404 — the SPA"
            echo "      fallback would boot the shell inside an app frame."
            exit 1
          fi

          docker rm -f caddy-cors

      # NB_NOINDEX is substituted at config load, so only a running server shows
      # whether the header reaches each kind of response: static, the generated
      # config, and proxied (the matcher sits at site scope, above every handler).
      - name: NB_NOINDEX sends X-Robots-Tag on every response, and only when true
        run: |
          set -euo pipefail
          mkdir -p srv/assets
          echo '<html></html>' > srv/index.html
          head -c 64 /dev/urandom > srv/assets/probe.woff2
          docker network create noindex
          docker run -d --name upstream --network noindex "$CADDY_IMAGE" \
            caddy respond --listen :9000 upstream
          paths="/ /w/acme /config.js /assets/probe.woff2 /v1/probe /mcp /.well-known/probe"
          run_with() {
            docker rm -f caddy-noindex >/dev/null 2>&1 || true
            docker run -d --name caddy-noindex --network noindex "$@" \
              -e PLATFORM_URL=http://upstream:9000 \
              -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$PWD/srv:/srv:ro" \
              -p 8081:8080 "$CADDY_IMAGE" >/dev/null
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null "http://localhost:8081/" && break || sleep 1
            done
            curl -fsS -o /dev/null "http://localhost:8081/" || {
              echo "FAIL: caddy never became ready"; docker logs caddy-noindex; exit 1; }
            curl -fsS http://localhost:8081/v1/probe | grep -q upstream || {
              echo "FAIL: /v1 did not reach the upstream"; docker logs caddy-noindex; exit 1; }
          }

          echo "--- NB_NOINDEX=true: every response carries noindex ---"
          run_with -e NB_NOINDEX=true
          for p in $paths; do
            curl -sI "http://localhost:8081$p" \
              | grep -iq '^x-robots-tag: noindex, nofollow' || {
              echo "FAIL: $p lacks X-Robots-Tag with NB_NOINDEX=true"; exit 1; }
          done

          for setting in unset false; do
            echo "--- NB_NOINDEX $setting: no response carries it ---"
            if [ "$setting" = unset ]; then run_with; else run_with -e NB_NOINDEX=false; fi
            for p in $paths; do
              if curl -sI "http://localhost:8081$p" | grep -iq '^x-robots-tag'; then
                echo "FAIL: $p sends X-Robots-Tag with NB_NOINDEX $setting"; exit 1
              fi
            done
          done

          docker rm -f caddy-noindex upstream
          docker network rm noindex
