name: Deploy Docs

# Builds docs/ and deploys to GitHub Pages (docs.nimblebrain.ai).
# Runs on push to main when docs change. The custom domain is configured in
# repo Settings -> Pages; docs/public/CNAME keeps it on the artifact.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/src/theme/palette.ts'
      # The Server SDK pages are built from the package's docstrings and examples.
      - 'packages/server-sdk-py/src/**'
      - 'packages/server-sdk-py/examples/**'
      - 'packages/server-sdk-py/pyproject.toml'
      - 'packages/server-sdk-py/uv.lock'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same bun as ci.yml (test/unit/build-pins.test.ts checks it).
          # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
          bun-version: "1.4.4"
      # The build writes the Server SDK API reference from the package's docstrings.
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv dropped floating major tags (v8+); pin exact
      - name: Build
        run: cd docs && bun install --frozen-lockfile && bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
          # v5 excludes hidden files by default; keep v3's include-everything behavior.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
