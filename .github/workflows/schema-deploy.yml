name: Deploy Schemas

# Publishes this repo's canonical JSON schemas, and the host bridge constants
# document, to schemas.nimblebrain.ai (S3 + CloudFront invalidation) on push to
# main when one of them changes. This
# repo is the canonical source; the published URLs are just the artifacts
# editors and external validators fetch via `$schema` / `$id`.
#
#   - src/config/nimblebrain-config.schema.json -> /v1/nimblebrain-config.schema.json
#   - src/connectors/catalog/schemas/host-manifest.schema.json -> /v1/nimblebrain-host.schema.json
#     (the `ai.nimblebrain/host` _meta extension — how an MCP server declares
#      its UI placement in the host shell. PUBLISHED-ONLY: nothing in this repo
#      validates against it, since the runtime reads that block from a catalog
#      entry it already trusts rather than gating an install on it. It is the
#      reference an author and their editor fetch, so it has no local guard
#      keeping it in step with `HostManifestMeta` — change both together.)
#   - web/src/bridge/host-constants.json -> /v1/nimblebrain-host-bridge.constants.json
#     (the app bridge's identifiers and limits, generated from the bridge's own
#      source by `bun run gen:host-constants` and held in step by
#      test/unit/bridge/host-constants.test.ts. An SDK that holds copies of these
#      values tests them against this document. Plain JSON, not a JSON Schema,
#      so it is served as application/json.)
#
# Auth: GitHub OIDC -> the `github-actions-schemas-deploy` IAM role (defined in
# infra/terraform/shared). No long-lived AWS keys. The role's S3 write is scoped
# per object key, so it cannot touch the server schema that shares the bucket.
# NOTE: the role must be granted EACH S3 key below — adding a file here
# requires granting its `v1/<name>` key on the role (infra change),
# or the upload step 403s. Repo vars: SCHEMAS_DEPLOY_ROLE_ARN, SCHEMAS_CF_DISTRIBUTION_ID.

on:
  push:
    branches: [main]
    paths:
      - 'src/config/nimblebrain-config.schema.json'
      - 'src/connectors/catalog/schemas/host-manifest.schema.json'
      - 'web/src/bridge/host-constants.json'
      - '.github/workflows/schema-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: schema-deploy
  cancel-in-progress: false

env:
  BUCKET: schemas.nimblebrain.ai

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: src/config/nimblebrain-config.schema.json
            key: v1/nimblebrain-config.schema.json
            content_type: application/schema+json
          - file: src/connectors/catalog/schemas/host-manifest.schema.json
            key: v1/nimblebrain-host.schema.json
            content_type: application/schema+json
          - file: web/src/bridge/host-constants.json
            key: v1/nimblebrain-host-bridge.constants.json
            content_type: application/json
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.SCHEMAS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        # Short, revalidating TTL — NOT immutable. The /v1/ path evolves
        # additively (new optional fields), so consumers must be able to pick up
        # changes; immutable caching here is what stranded the schema before.
        env:
          FILE: ${{ matrix.file }}
          KEY: ${{ matrix.key }}
          CONTENT_TYPE: ${{ matrix.content_type }}
        run: |
          aws s3 cp "$FILE" "s3://$BUCKET/$KEY" \
            --content-type "$CONTENT_TYPE" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.SCHEMAS_CF_DISTRIBUTION_ID }}
          KEY: ${{ matrix.key }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/$KEY"
