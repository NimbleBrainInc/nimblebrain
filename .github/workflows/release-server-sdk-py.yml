name: Release server-sdk-py

# Triggered by tags matching `server-sdk-py/v*` (e.g. `server-sdk-py/v0.3.0`).
# Tests, builds the wheel + sdist, publishes to PyPI via Trusted Publishing
# (OIDC: no long-lived API token in repo secrets), and creates a GitHub
# Release. The runtime release workflow (`release.yml`) globs `v*`, which
# does not match this prefix, so the two pipelines stay independent.
#
# PyPI side, one-time per package: a trusted publisher for project
# `nimblebrain-server-sdk` with owner NimbleBrainInc, repository
# `nimblebrain`, workflow `release-server-sdk-py.yml`, environment `pypi`.
# The `pypi` environment in this repo's settings must carry the same name.

on:
  push:
    tags:
      - 'server-sdk-py/v*'

permissions:
  contents: write   # for GitHub Release creation
  id-token: write   # for PyPI Trusted Publishing (OIDC)

jobs:
  verify:
    name: Verify SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server-sdk-py
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv dropped floating major tags (v8+); pin exact
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: Lint
        # Include `tests/` so test-only imports/formatting drift fails
        # CI rather than getting caught on a release tag — release-time
        # lint failures block a publish, so scope shifts here are
        # better caught on PR.
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/
      - name: Type check
        run: uv run ty check src/ tests/
      - name: Test
        run: uv run pytest tests/ -v

  build-and-publish:
    name: Build + publish to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: pypi
      url: https://pypi.org/p/nimblebrain-server-sdk
    defaults:
      run:
        working-directory: packages/server-sdk-py
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0  # setup-uv dropped floating major tags (v8+); pin exact
      - name: Verify tag matches package version
        # Catches `server-sdk-py/v0.1.0` tagged against a pyproject.toml
        # still on `0.0.x`. Tag is the source of truth for version
        # numbers, but the pyproject.toml has to match because that's
        # what gets baked into the wheel.
        run: |
          TAG="${GITHUB_REF#refs/tags/server-sdk-py/v}"
          PKG_VERSION="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG"
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        # Trusted Publishing — no token needed; OIDC from id-token
        # permission authenticates against the PyPI publisher config.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/server-sdk-py/dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: server-sdk-py ${{ github.ref_name }}
          body: |
            Published to PyPI: https://pypi.org/project/nimblebrain-server-sdk/
            See `packages/server-sdk-py/CHANGELOG.md` for changes.
          files: |
            packages/server-sdk-py/dist/*.whl
            packages/server-sdk-py/dist/*.tar.gz
