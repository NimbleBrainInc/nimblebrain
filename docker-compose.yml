services:
  platform:
    image: ghcr.io/nimblebraininc/nimblebrain-runtime:${NIMBLEBRAIN_TAG:-latest}
    build: .
    restart: unless-stopped
    volumes:
      - workspace:/data
      # The identity provider. The runtime does not start without it; the
      # README quickstart shows the dev adapter and the real ones.
      - type: bind
        source: ./instance.json
        target: /data/instance.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - GREENPT_API_KEY=${GREENPT_API_KEY:-}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # Anonymous telemetry. Nothing is sent without a key, and nothing until a
      # person says yes (`npx nimblebrain` asks, or the web UI does once).
      - POSTHOG_API_KEY=${NB_TELEMETRY_KEY:-}
      - NB_TELEMETRY_ID=${NB_TELEMETRY_ID:-}
      - NB_TELEMETRY_CONSENT=${NB_TELEMETRY_CONSENT:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
      # A name that reaches this machine from inside the container, so a local
      # install can connect to an MCP server you run on the host
      # (`npx nimblebrain mcp add http://127.0.0.1:8000/mcp`). The runtime
      # honours it only with the `dev` adapter in instance.json; under any other
      # adapter it logs a warning and ignores it, so a self-hosted instance with
      # real sign-in is unaffected. ADR-0065.
      - NB_HOST_LOOPBACK=host.docker.internal
    # On Linux, `host-gateway` is the Docker bridge's address, not the host's
    # loopback: a server there must listen on the bridge or 0.0.0.0 to be reached.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  web:
    image: ghcr.io/nimblebraininc/nimblebrain-web:${NIMBLEBRAIN_TAG:-latest}
    build: web/
    restart: unless-stopped
    ports:
      # This machine only. The `dev` adapter checks no credential, so the UI
      # is not published to the network. To serve other machines, first set a
      # real adapter in instance.json, then put a TLS proxy in front or
      # publish "27246:8080". NIMBLEBRAIN_WEB_PORT moves the host port, which
      # is how `npx nimblebrain --port` runs beside something already on 27246.
      - "127.0.0.1:${NIMBLEBRAIN_WEB_PORT:-27246}:8080"
    environment:
      - PLATFORM_URL=http://platform:27247
      # Sends only after the runtime reports that a person said yes.
      - NB_POSTHOG_KEY=${NB_TELEMETRY_KEY:-}
      - NB_POSTHOG_ENABLED=${NB_TELEMETRY_KEY:+true}
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - internal

volumes:
  workspace:

networks:
  internal:
