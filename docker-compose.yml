services:
  platform:
    image: ghcr.io/nimblebraininc/nimblebrain-runtime:latest
    build: .
    restart: unless-stopped
    volumes:
      - workspace:/data
      - ./skills:/app/skills:ro
      # The identity provider. The runtime does not start without it; the
      # README quickstart shows the dev adapter and the real ones.
      - type: bind
        source: ./instance.json
        target: /data/instance.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    networks:
      - internal

  web:
    image: ghcr.io/nimblebraininc/nimblebrain-web:latest
    build: web/
    restart: unless-stopped
    ports:
      - "27246:8080"
    environment:
      - PLATFORM_URL=http://platform:27247
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - internal

volumes:
  workspace:

networks:
  internal:
