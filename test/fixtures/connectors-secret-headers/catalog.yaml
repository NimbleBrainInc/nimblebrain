# Test fixture — a catalog entry that authenticates as ITSELF (a minted service
# token) and carries the WORKSPACE's own secret on a named header. Not shipped.
#
# The shape under test is the two-credential one: `providerAuth` says who is
# calling, `secretHeaders` says what that caller may open. A service reading a
# customer-owned database needs both — the platform must know which workspace
# is asking, and the connection must carry a credential only that workspace
# holds. Neither value is in this file; the header names a KEY.
servers:
  - name: com.acme/db-query
    title: Acme DB Query
    description: Read-only queries against the workspace's own database
    version: "1.0.0"
    remotes:
      - type: streamable-http
        url: https://mcp.acme.test/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: provider
        providerAuth:
          provider: minted
          config:
            audience: mcp-fleet
            scope: mcp:invoke
        secretHeaders:
          X-Db-Url:
            ref: credential
            key: acme.db_url
        tags: [database]

  # A miscurated entry: the value is the secret rather than a reference to one.
  # Install must refuse it — a catalog file is configuration in git, and a secret
  # written here is the copy the credential store exists to remove.
  - name: com.acme/db-query-literal
    title: Acme DB Query (miscurated)
    description: Carries a literal where a credential reference belongs
    version: "1.0.0"
    remotes:
      - type: streamable-http
        url: https://mcp.acme.test/literal/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: provider
        providerAuth:
          provider: minted
          config:
            audience: mcp-fleet
            scope: mcp:invoke
        secretHeaders:
          X-Db-Url: postgres://literal.acme.test/db

  # The ordinary shape of a fleet connector: provider auth, no workspace secret.
  # Install must not let a caller ADD one — a header the operator never declared,
  # bound to a key of the caller's choosing, would ride the fleet-minted identity.
  - name: com.acme/plain-fleet
    title: Acme Plain Fleet
    description: A platform connector that declares no workspace secret
    version: "1.0.0"
    remotes:
      - type: streamable-http
        url: https://mcp.acme.test/plain/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: provider
        providerAuth:
          provider: minted
          config:
            audience: mcp-fleet
            scope: mcp:invoke

  # The OTHER place a provider-auth entry names a workspace key: the built-in
  # `credential` provider resolves `config.key` from the workspace store on every
  # request, and an entry using this shape declares no `secretHeaders` at all.
  #
  # It names `acme.db_url` on purpose — the same key `com.acme/db-query` binds to
  # a header, mirroring the two examples in `docs/config/secrets.mdx`. Two
  # installed connectors on one key is what the uninstall reference check exists
  # to survive.
  - name: com.acme/db-direct
    title: Acme DB Direct
    description: Authenticates as the workspace's own database credential
    version: "1.0.0"
    remotes:
      - type: streamable-http
        url: https://mcp.acme.test/direct/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: provider
        providerAuth:
          provider: credential
          config:
            key: acme.db_url
        tags: [database]

  # The THIRD place a ref names a workspace key: a static-auth entry's
  # `operatorSetup.clientSecretKey`, which `resolveStaticOAuthClient` resolves
  # from this same store. Uninstall never deletes it — `remove_operator_setup`
  # owns it, and it is the workspace's app secret for a whole vendor rather than
  # one connector's credential — but it is still a reason not to delete it out
  # from under this entry on some OTHER connector's uninstall.
  #
  # It names `acme.db_url` on purpose, same as the two above.
  - name: com.acme/db-operator
    title: Acme DB Operator App
    description: Connects through the workspace's own registered OAuth app
    version: "1.0.0"
    remotes:
      - type: streamable-http
        url: https://mcp.acme.test/operator/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: static
        operatorSetup:
          portalUrl: https://acme.test/developers
          hint: Create an app, paste the client id and secret
          clientSecretKey: acme.db_url
        tags: [database]
