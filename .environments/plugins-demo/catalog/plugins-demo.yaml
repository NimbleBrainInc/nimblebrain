# The Plugins page demo catalog (`bun run dev:plugins-demo`).
#
# The launcher points NB_CURATED_CATALOG_DIR here. Every entry is a remote
# server at a fictional `.example` host, so nothing in the demo reaches a
# vendor: an entry the seed installs without tokens stays "needs sign-in",
# and clicking Connect fails at discovery instead of opening a real sign-in.
# The seed (scripts/lib/plugins-demo/) installs some of these into the demo
# workspaces and as personal plugins; the rest only show under Browse.

servers:
  - name: com.notion/mcp
    title: Notion
    description: Read and write workspace pages
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/notion/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://notion.mcp.example/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: dcr
        tags: [docs, knowledge]

