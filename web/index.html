<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The shell draws its own light and dark themes. These tell a browser's
         force-dark feature to leave the page alone: `color-scheme` for Chrome's
         auto-dark, `darkreader-lock` for Dark Reader and the browsers that embed
         it (Firefox for iOS's website dark mode). index.css sets the active
         scheme per mode. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
    <title>NimbleBrain</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
    <!-- Runtime config (window.__NB_CONFIG__). A non-module script runs before
         the deferred app module, so the global exists when initSentry() runs.
         Filled per tenant at container start; see web/Dockerfile + config.ts. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
