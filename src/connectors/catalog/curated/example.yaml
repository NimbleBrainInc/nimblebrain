# Example catalog for a source checkout (dev and tests).
#
# Used when NB_CURATED_CATALOG_DIR is unset and the runtime runs from source:
# enough for a non-empty Browse and a working reference for the
# `ServerDetail` wire shape (the upstream MCP registry schema, ajv-validated
# against `schemas/server.schema.json`). The release image does not ship
# this file; it takes NimbleBrain's catalog of zero-setup connectors at build
# (see the Dockerfile).
#
# It deliberately ships ONLY plain DCR entries — every entry here must
# install with zero OAuth client setup. Production curation — the full
# connector set, `auth: static` entries, and
# Composio-backed toolkits — is deployment configuration, not runtime
# code: a deployment points `NB_CURATED_CATALOG_DIR` at a mounted
# directory of catalog files, which replaces this example wholesale.
#
# The catalog reads every `*.yaml`/`*.yml`/`*.json` in this directory
# in sorted filename order and aggregates them into one list, so
# additional example files can be dropped here without further wiring.

servers:
  - name: com.notion/mcp
    title: Notion
    description: Read & write workspace pages
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/logos/notion/light.svg
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.notion.com/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: dcr
        tags: [docs, knowledge]

  - name: app.linear/mcp
    title: Linear
    description: Issues, projects, and product roadmaps
    version: "1.0.0"
    icons:
      - src: https://static.nimblebrain.ai/icons/linear.png
        sizes: ["any"]
    remotes:
      - type: streamable-http
        url: https://mcp.linear.app/mcp
    _meta:
      ai.nimblebrain/connector:
        auth: dcr
        tags: [issues, project-mgmt]
