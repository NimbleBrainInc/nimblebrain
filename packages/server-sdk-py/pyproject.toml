[project]
name = "nimblebrain-server-sdk"
version = "0.3.1"
description = "The SDK for building MCP servers that run on NimbleBrain: tool annotations, change announcements, the ai.nimblebrain platform extensions (facets, lifecycle, record views), skills over the MCP Skills extension, bounded listing rows, record ids, host-resources reads, and the service error contract; with tenant- and workspace-isolated Postgres access ([db]) and metrics, logs and traces ([observability])."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "NimbleBrain" }]
keywords = [
    "mcp",
    "nimblebrain",
    "mcp-server",
    "fastmcp",
    "host-resources",
    "skills",
    "row-level-security",
    "postgres",
    "multi-tenant",
    "observability",
    "opentelemetry",
    "prometheus",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # FastMCP is the layer servers build on; Context, the extension seam and
    # the tool registry come from there. The floor is 4 because fastmcp-slim 4
    # needs mcp>=2 and 3 needs mcp<2, so a consumer still on FastMCP 3 fails to
    # resolve visibly instead of being moved across a major. No ceiling: the
    # SDK uses FastMCP's public API only. Pull requests test the locked
    # versions (`uv.lock`); a weekly run tests the newest versions that resolve,
    # so a new FastMCP release that breaks the SDK shows up within a week.
    "fastmcp>=4.0.0",
    # The underlying MCP types (ReadResourceResult, ListResourcesResult,
    # ClientCapabilities) and the SEP-2133 `Extension` API the skills
    # extension builds on are imported from this. FastMCP depends on it
    # transitively; pinning explicitly so the SDK's import paths don't
    # silently break when FastMCP's transitive resolution shifts.
    #
    # The floor is 2.0.0 because every surface the SDK uses is present
    # and unchanged from 2.0.0 on: `mcp.server.extension` is identical
    # across 2.0.0-2.3.0, and so is `ServerSession.send_request`, which
    # the host-resources dispatch (`cast(ServerRequest, ...)` in
    # `host.py`) relies on to dump and forward the request rather than
    # validate it against the `ServerRequest` union. mcp's public surface
    # does not guarantee that behaviour, and its loss would show up at
    # runtime, not at import.
    #
    # That is why the ceiling is a minor, not the major: each upstream
    # minor is admitted by a bump here, after diffing `mcp/server/session.py`
    # and `mcp/server/extension.py`, with `uv.lock` moved to it in the same
    # change so the pull-request job runs the suite on it. Cut an SDK major if
    # the dispatch shape itself has to change.
    "mcp>=2.0.0,<2.4.0",
    # Imported directly (the skills request models, the testing helpers).
    "pydantic>=2.12",
    # SKILL.md frontmatter parsing for the skills extension.
    "pyyaml>=6.0",
]

# Optional halves a server installs only when it uses them. The core imports neither; importing
# `nimblebrain_server_sdk.db` or `.observability` without its extra raises an ImportError that
# names the extra.
[project.optional-dependencies]
db = [
    # The generic core (policy rendering, sessions, pool, admission). Pinned exactly: the golden
    # SQL tests hold `db` to the SQL that replayed migrations build, so a core upgrade is a
    # deliberate, reviewed change.
    "pgbulkhead==0.1.1",
    "sqlalchemy[asyncio]>=2.0.36",
    # The driver `create_pooled_engine` URLs name (`postgresql+asyncpg://`).
    "asyncpg>=0.30",
]
observability = [
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.urls]
Homepage = "https://nimblebrain.ai"
Documentation = "https://docs.nimblebrain.ai"
Repository = "https://github.com/NimbleBrainInc/nimblebrain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimblebrain_server_sdk"]

# The sdist carries what builds and tests the package, not the repository's
# tooling around it (the lockfile, uv's settings). Hatchling adds .gitignore
# to every sdist on its own, so that one stays.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx2>=2.13",
    # The observability tests instrument a FastAPI app and drive it with Starlette's TestClient.
    "fastapi>=0.133",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# ASYNC, BLE and PT catch the bugs async and test code tends to grow (a busy-wait, a swallowed
# exception, a `raises` that passes on the wrong error); S is the security set; ANN holds every
# signature to an annotation, because the wheel ships `py.typed` and a consumer's type checker
# reads them. `Any` is allowed where a value is genuinely open (ASGI messages, `_meta`).
select = ["E", "W", "F", "I", "B", "C4", "UP", "ASYNC", "BLE", "RUF", "PT", "S", "ANN"]
ignore = ["E501", "B008", "ANN401"]

# Deliberate mathematical symbols in prose (a product, a set union), not look-alikes.
allowed-confusables = ["×", "∪"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build SQL from the identifiers they create, and spawn the interpreter; their
# signatures are fixtures, not API.
"tests/**" = ["S101", "S603", "S608", "ANN"]
# The testing helpers are assertions a server's tests call: asserting is their contract.
"src/nimblebrain_server_sdk/testing.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["nimblebrain_server_sdk"]
branch = true

[tool.coverage.report]
# A floor under the branch coverage CI measures with every extra installed (the paths only a
# core install reaches are held by scripts/check_core_only.py instead). Raise it as coverage
# rises; a change that lowers coverage below it fails CI.
fail_under = 96
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
