[project]
name = "nimblebrain-bundle-sdk"
version = "0.1.0"
description = "Python SDK for NimbleBrain MCP bundles. Lets bundles read workspace files via the ai.nimblebrain/host-resources extension."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NimbleBrain" }]
keywords = ["mcp", "nimblebrain", "bundle", "host-resources"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # FastMCP is the layer bundles build on; Context comes from there.
    # FastMCP 4 is required, not merely tolerated: fastmcp-slim 4 needs
    # mcp>=2 and fastmcp-slim 3 needs mcp<2, so the two majors move
    # together. Declaring the floor makes a consumer still on FastMCP 3
    # fail to resolve — visibly — instead of being force-upgraded
    # across a major by transitive resolution.
    "fastmcp>=4.0.0,<5",
    # The underlying MCP types (ReadResourceResult, ListResourcesResult,
    # ClientCapabilities) are imported from this. FastMCP depends on it
    # transitively; pinning explicitly so the SDK's import paths don't
    # silently break when FastMCP's transitive resolution shifts.
    #
    # The upper bound is intentional and deliberately narrow. The SDK's
    # custom-method dispatch (`cast(ServerRequest, ...)` in `host.py`)
    # relies on `ServerSession.send_request` dumping and forwarding the
    # request rather than validating it against the `ServerRequest`
    # union — behaviour mcp's public surface does not guarantee, and
    # whose loss shows up at runtime, not at import. Capability
    # detection is the same kind of surface: 2.x moved `extensions`
    # from an `extra="allow"` passthrough to a declared field, which
    # changed how it must be read.
    #
    # No pull-request job runs this package's tests, so a single-minor
    # bound is the only thing forcing each upstream minor to be
    # verified by hand. Widen it to a major bound once PR-time coverage
    # exists; cut an SDK major if the dispatch shape itself has to
    # change.
    "mcp>=2.1.1,<2.2.0",
]

[project.urls]
Homepage = "https://nimblebrain.ai"
Documentation = "https://docs.nimblebrain.ai"
Repository = "https://github.com/NimbleBrainInc/nimblebrain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimblebrain_bundle_sdk"]

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
