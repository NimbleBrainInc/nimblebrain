[project]
name = "nimblebrain-bundle-sdk"
version = "0.2.0"
description = "Python SDK for NimbleBrain MCP bundles: read workspace files via ai.nimblebrain/host-resources, and publish skills via the MCP Skills extension (SEP-2640)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NimbleBrain" }]
keywords = ["mcp", "nimblebrain", "bundle", "host-resources", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # FastMCP is the layer bundles build on; Context comes from there.
    # FastMCP 4 is required, not merely tolerated: fastmcp-slim 4 needs
    # mcp>=2 and fastmcp-slim 3 needs mcp<2, so the two majors move
    # together. Declaring the floor makes a consumer still on FastMCP 3
    # fail to resolve — visibly — instead of being force-upgraded
    # across a major by transitive resolution.
    "fastmcp>=4.0.0,<5",
    # The underlying MCP types (ReadResourceResult, ListResourcesResult,
    # ClientCapabilities) and the SEP-2133 `Extension` API the skills
    # extension builds on are imported from this. FastMCP depends on it
    # transitively; pinning explicitly so the SDK's import paths don't
    # silently break when FastMCP's transitive resolution shifts.
    #
    # The floor is 2.0.0 because every surface the SDK uses is present
    # and unchanged from 2.0.0 on: `mcp.server.extension` is identical
    # across 2.0.0-2.2.x, and so is `ServerSession.send_request`, which
    # the host-resources dispatch (`cast(ServerRequest, ...)` in
    # `host.py`) relies on to dump and forward the request rather than
    # validate it against the `ServerRequest` union. mcp's public surface
    # does not guarantee that behaviour, and its loss would show up at
    # runtime, not at import.
    #
    # That is why the ceiling is a minor, not the major: no pull-request
    # job runs this package's tests, so the bound is what forces each
    # upstream minor to be checked (diff `mcp/server/session.py` and
    # `mcp/server/extension.py`, run the suite) before it is admitted.
    # Widen it to `<3` once PR-time coverage exists; cut an SDK major if
    # the dispatch shape itself has to change.
    "mcp>=2.0.0,<2.3.0",
    # SKILL.md frontmatter parsing for the skills extension.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://nimblebrain.ai"
Documentation = "https://docs.nimblebrain.ai"
Repository = "https://github.com/NimbleBrainInc/nimblebrain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimblebrain_bundle_sdk"]

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
